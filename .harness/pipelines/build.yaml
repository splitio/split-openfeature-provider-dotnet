pipeline:
  name: split-openfeature-provider-dotnet
  identifier: splitopenfeatureproviderdotnet
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        repoName: split-openfeature-provider-dotnet
        build: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run
                  name: Setup NET SDK
                  identifier: Setup_NET_SDK
                  spec:
                    shell: Powershell
                    command: |-
                      # Install .NET SDK (adjust version as needed)
                      Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "dotnet-install.ps1"
                      .\dotnet-install.ps1 -Channel 9.0 -InstallDir "C:\dotnet"
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet --version
              - step:
                  type: Run
                  name: Restore Dependencies
                  identifier: Restore_Dependencies
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet restore
              - step:
                  type: Run
                  name: Build Solution
                  identifier: Build_Solution
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet build --configuration Release --no-restore
              - step:
                  type: Run
                  name: Run Unit Tests with Coverage
                  identifier: Run_Unit_Tests
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet test .\ProviderTests\ProviderTests.csproj `
                        -c Release `
                        -f net9.0 `
                        --no-build `
                        --collect:"XPlat Code Coverage" `
                        --results-directory:"./TestResults" `
                        -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover
                      $report = Get-ChildItem -Path .\TestResults -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
                      if (-not $report) { throw "Cobertura report not found under TestResults" }
                      New-Item -ItemType Directory -Force -Path .\coverage | Out-Null
                      Copy-Item $report.FullName .\coverage\cobertura.xml -Force
                      Get-Item .\coverage\cobertura.xml | Format-List FullName,Length
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  template:
                    templateRef: account.codeCoverageWindows
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: coverage/cobertura.xml
                          overall_coverage_percent: ""
                          ignore_failure: "false"
                          exclude: "**/bin/**,**/obj/**,**/*Tests*/**,**/*Test.cs,**/*Tests.cs"
                  when:
                    stageStatus: Success
              - step:
                  type: Run
                  name: Run Tests Net462
                  identifier: Run_Tests_Net462
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet test .\ProviderTests\ProviderTests.csproj `
                        -c Release `
                        -f net462 `
                        --no-build
              - step:
                  type: Run
                  name: Create Nuget
                  identifier: create_nuget
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      if (!(Test-Path ".\nuget")) { mkdir .\nuget }
                      dotnet pack .\Splitio.OpenFeature.Provider\Splitio.OpenFeature.Provider.csproj --output .\nuget --configuration Release
              - step:
                  type: Run
                  name: Upload Nuget package
                  identifier: upload_nuget_package
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet nuget push '.\nuget\*.nupkg' -k $Env:API_KEY -s 'https://harness0.harness.io/pkg/l7B_kbSEQD2wjrM7PShm5w/fme-nuget/nuget/'
                    envVariables:
                      API_KEY: <+secrets.getValue("harness-ci-nuget-token")>
          platform:
            os: Windows
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
